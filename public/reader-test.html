<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reader test</title>
<style>
 body{background-color:#050e1b;background-image:radial-gradient(circle at top center,#111d2e 0%,#050e1b 100%);color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:60px 20px 120px;display:flex;flex-direction:column;align-items:center;gap:40px;}
 .document{background:rgba(255,255,255,0.02);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:70px 80px;max-width:700px;width:100%;box-sizing:border-box;}
 .metadata{color:#c5a059;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;}
 .page-counter{font-size:12px;color:#64748b;margin:6px 0 20px;letter-spacing:1px;text-transform:uppercase;}
 h1{font-family:"Times New Roman",Times,serif;font-size:32px;color:#fff;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:20px;margin-top:0;line-height:1.3;font-weight:normal;}
 .content p{font-size:18px;line-height:1.8;color:#b3b9c5;margin-bottom:24px;font-weight:300;}
 .content strong{color:#c5a059;font-weight:500;}
 @media(max-width:800px){.document{padding:40px 16px;}}
</style></head><body>
<script>
(async function(){
  const cat = await (await fetch('./data/catalog.json')).json();
  const c = cat.cases[0];
  const s = await (await fetch('./data/'+cat.series[0].file)).json();
  const pages = s.cases[c.slug].pages;
  for(const p of pages){
    const d = document.createElement('div'); d.className='document';
    d.innerHTML = '<div class="metadata">Case '+c.id.padStart(2,'0')+'</div>'+
      '<div class="page-counter">Page '+p.page+' of '+pages.length+'</div>'+
      '<h1>'+c.id+'.'+p.page+' '+p.title+'</h1>'+
      '<div class="content">'+p.content+'</div>';
    document.body.appendChild(d);
  }
})();
</script>
</body></html>
