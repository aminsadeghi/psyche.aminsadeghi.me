            border-radius: 6px;

            display: flex;
            flex-direction: column;

            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;

            color: #8a9bb1;

            letter-spacing: 2px;
            text-align: center;
            margin-top: 8px;
            padding-bottom: 4px;

            left: 50%;

            height: 8px;
            background: #c5a059;
            border-radius: 50%;
            box-shadow: 0 0 10px #c5a059;
            z-index: 5;

        .read-btn-container {
                position: absolute;

                transform: translateX(-50%);
                z-index: 20;
            }

        .coord-1 { top: 30%; left: 35%; }
        .coord-2 { top: 70%; left: 55%; }
        .coord-3 { top: 40%; left: 75%; }

                justify-content: space-between;
                align-items: flex-start;
                gap: 8px;

            .connections-layer {
                display: none; /* Hide background SVG lines */

                margin: 0;

            position: fixed;

            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;

        .char-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 17px;
            box-sizing: border-box;
            background: rgba(197, 160, 89, 0.14);
            border: 1px solid rgba(197, 160, 89, 0.55);
            border-radius: 999px;
            color: #d4b26a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;

        .char-btn:hover, .char-btn:focus-visible {

        .char-btn:active { transform: translateY(0); }
        .char-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: 0 0 auto; }

        @media (max-width: 800px) {
            .char-btn { padding: 10px; gap: 0; }
            .char-btn .char-btn-label { display: none; }
        }

        /* --- BEGIN OVERLAY (full-screen "Start Here" — rail + reader) --- */
        .begin-overlay {
            position: fixed;
            inset: 0;
            z-index: 2147483005;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            box-sizing: border-box;
            background: rgba(3, 8, 16, 0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .begin-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
        .begin-modal {
            position: relative;
            width: 100%;
            max-width: 1080px;
            height: 88vh;
            display: flex;
            box-sizing: border-box;
            background: linear-gradient(160deg, #0c1626 0%, #060e1b 100%);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            transform: translateY(14px) scale(0.98);
            transition: transform 0.3s ease;
        }
        .begin-overlay.open .begin-modal { transform: translateY(0) scale(1); }
        .begin-close {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 5;
            background: none;
            border: none;
            color: #8a9bb1;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .begin-close:hover { color: #ebd299; }

        .begin-rail {

        .begin-rail-heading {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            padding: 22px 28px 10px;

        .begin-nav-item {

            gap: 12px;
            padding: 11px 28px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.18s ease, border-color 0.18s ease;

        .begin-nav-item:hover { background: rgba(197, 160, 89, 0.08); }
        .begin-nav-item.active { background: rgba(197, 160, 89, 0.14); border-left-color: #c5a059; }
        .begin-nav-num {
            font-family: "Times New Roman", Times, serif;
            font-size: 13px;
            color: #c5a059;
            min-width: 20px;
        }
        .begin-nav-title {
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            color: #c7cfdb;
            line-height: 1.3;

        .begin-nav-about { flex-direction: column; gap: 3px; padding-bottom: 16px; }
        .begin-nav-about .begin-nav-title { color: #d4b26a; font-size: 18px; }
        .begin-nav-sub {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }

        .begin-detail { flex: 1 1 auto; overflow-y: auto; padding: 44px 52px; }
        .begin-detail::-webkit-scrollbar, .begin-rail::-webkit-scrollbar { width: 8px; }
        .begin-detail::-webkit-scrollbar-thumb, .begin-rail::-webkit-scrollbar-thumb { background: rgba(197, 160, 89, 0.3); border-radius: 4px; }

        .begin-hero {
            width: 100%;
            height: 260px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 26px;
            border: 1px solid rgba(197, 160, 89, 0.25);

        .begin-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .begin-story-meta {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c5a059;
            margin-bottom: 8px;
        }
        .begin-story-title, .begin-about-title {
            font-family: "Times New Roman", Times, serif;
            font-size: 40px;
            color: #ebd299;
            margin: 0 0 14px;
            line-height: 1.05;
        }
        .begin-story-tagline {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 18px;
            line-height: 1.6;
            color: #a9b6c6;
            margin: 0 0 26px;
            padding-left: 16px;
            border-left: 2px solid rgba(197, 160, 89, 0.4);
        }
        .begin-story-body p, .begin-about p {
            font-family: "Times New Roman", Times, serif;
            font-size: 17px;
            line-height: 1.85;
            color: #c7cfdb;
            margin: 0 0 18px;

        .begin-about-sub {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c5a059;
            margin-bottom: 26px;
        }
        .begin-read-btn {
            display: inline-block;
            margin: 10px 0 4px;
            padding: 12px 26px;
            border-radius: 999px;
            background: rgba(197, 160, 89, 0.16);
            border: 1px solid rgba(197, 160, 89, 0.6);
            color: #d4b26a;
            text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .begin-read-btn:hover { background: rgba(197, 160, 89, 0.3); color: #fff; border-color: #c5a059; }
        .begin-related { margin-top: 34px; padding-top: 24px; border-top: 1px solid rgba(197, 160, 89, 0.2); }
        .begin-related-label {
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 12px;
        }
        .begin-related-btns { display: flex; flex-wrap: wrap; gap: 10px; }
        .begin-related-btn {
            padding: 9px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: #c7cfdb;

            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;

        @media (max-width: 800px) {

            .begin-modal { height: 100vh; height: 100dvh; max-width: 100%; border-radius: 0; flex-direction: column; }

    <div class="right-panel">

        <div class="dashboard-header">
            <div class="dash-meta-left" id="dash-meta-left">

        </div>

        <p class="dash-tagline" id="dash-tagline">Psychology, read as story. The first case file is coming soon.</p>

        <div class="board-wrapper" id="board-wrapper">
            <svg class="connections-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
                <line x1="35" y1="30" x2="55" y2="70" />
                <line x1="55" y1="70" x2="75" y2="40" />
            </svg>
            
            <div class="node-container coord-1">
                <div class="node-dot"></div>
                <img id="node-img-1" src="" alt="">
                <span class="node-label" id="node-label-1"></span>
            </div>
            
            <div class="node-container coord-2">
                <div class="node-dot"></div>
                <img id="node-img-2" src="" alt="">
                <span class="node-label" id="node-label-2"></span>
            </div>
            
            <div class="node-container coord-3">
                <div class="node-dot"></div>
                <img id="node-img-3" src="" alt="">
                <span class="node-label" id="node-label-3"></span>
            </div>
        </div>

        <div class="dashboard-footer">
            <div class="mini-dock" id="mini-dock">
                <!-- Page indicators injected here -->
            </div>
            <a href="#" class="read-btn" id="read-btn" style="display:none;">Read the Case &rarr;</a>
        </div>
    </div>

    <!-- TOP-RIGHT CLUSTER — Begin (opens the About/Thin Ice overlay) + Structures (a page). -->
    <div class="top-cluster" id="top-cluster">
        <div class="char-btn" id="begin-pill" role="button" tabindex="0" aria-label="Begin — about this site and where to start" onclick="openBegin()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-2.4 5.6L8.8 15.2l2.4-5.6z"></path></svg>
            <span class="char-btn-label">Begin</span>
        </div>
        <a class="char-btn" id="atlas-btn" href="/atlas.html" aria-label="Atlas — the whole map of The Psyche">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="2.1"></circle><circle cx="5" cy="19.5" r="2.1"></circle><circle cx="12" cy="19.5" r="2.1"></circle><circle cx="19" cy="19.5" r="2.1"></circle><path d="M12 6.1v4.4M5 17.4v-3.8h14v3.8M12 13.6v3.8"></path></svg>
            <span class="char-btn-label">Atlas</span>
        </a>
        <a class="char-btn" id="structures-btn" href="/structures.html" aria-label="Structures — the maps of the psyche">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.4"></circle></svg>
            <span class="char-btn-label">Structures</span>
        </a>
    </div>

    <!-- BEGIN overlay — "Start Here": an About-this-site pane plus The Thin Ice, a short
         reading that bridges from The Mythos. Data-driven from /data/begin.json. -->
    <div class="begin-overlay" id="begin-overlay" onclick="beginBackdrop(event)">
        <div class="begin-modal" role="dialog" aria-modal="true" aria-label="Begin — start here">
            <button class="begin-close" aria-label="Close" onclick="closeBegin()">&times;</button>
            <div class="begin-rail" id="begin-rail"><!-- injected --></div>
            <div class="begin-detail" id="begin-detail"><!-- injected --></div>
        </div>
    </div>

    <script>
        // Check if the server injected the data. If not, this remains null.
        let catalogData = window.__CATALOG_DATA__ || null;
        let beginData = null;   // /data/begin.json — the "Begin" About + reading

        // --- "Begin" overlay: an About pane for the site, plus The Thin Ice, a short
        //     reading. Path entries are self-contained (their own title + paragraphs);
        //     if a slug ever matches a real case, its image/tagline/read-link load live. ---
        function beginCaseBySlug(slug) {
            return catalogData ? catalogData.cases.find(c => c.slug === slug) : null;
        }
        function setBeginActive(id) {
            document.querySelectorAll('#begin-rail .begin-nav-item').forEach(n => n.classList.remove('active'));
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
        }
        function buildBegin() {
            if (!beginData) return;
            const rail = document.getElementById('begin-rail');
            rail.innerHTML = '';

            const about = document.createElement('div');
            about.className = 'begin-nav-item begin-nav-about';
            about.id = 'begin-nav-about';
            about.onclick = showBeginAbout;
            about.innerHTML = `<span class="begin-nav-title">${beginData.about.title}</span>` +
                              `<span class="begin-nav-sub">${beginData.about.subtitle}</span>`;
            rail.appendChild(about);

            if (beginData.path && beginData.path.length) {
                const heading = document.createElement('div');
                heading.className = 'begin-rail-heading';
                heading.textContent = beginData.pathHeading || 'The Reading';
                rail.appendChild(heading);

                beginData.path.forEach((entry, i) => {
                    const c = beginCaseBySlug(entry.slug);
                    const item = document.createElement('div');
                    item.className = 'begin-nav-item';
                    item.id = `begin-nav-${entry.slug}`;
                    item.onclick = () => showBeginStory(entry.slug);
                    item.innerHTML = `<span class="begin-nav-num">${String(i + 1).padStart(2, '0')}</span>` +
                                     `<span class="begin-nav-title">${c ? c.title : (entry.title || entry.slug)}</span>`;
                    rail.appendChild(item);
                });
            }
        }
        function showBeginAbout() {
            if (!beginData) return;
            setBeginActive('begin-nav-about');
            const a = beginData.about;
            const d = document.getElementById('begin-detail');
            d.innerHTML = `<div class="begin-about">` +
                `<h2 class="begin-about-title">${a.title}</h2>` +
                `<div class="begin-about-sub">${a.subtitle}</div>` +
                a.paragraphs.map(p => `<p>${p}</p>`).join('') +
                `</div>`;
            d.scrollTop = 0;
        }
        function showBeginStory(slug) {
            if (!beginData) return;
            const entry = beginData.path.find(e => e.slug === slug);
            if (!entry) return;
            setBeginActive(`begin-nav-${slug}`);
            const c = beginCaseBySlug(slug);
            const d = document.getElementById('begin-detail');
            const img = (c && c.nodes && c.nodes[0]) ? c.nodes[0].image : '';
            const seriesInfo = c ? catalogData.series.find(s => s.id === c.seriesId) : null;
            const meta = seriesInfo ? `${seriesInfo.title} • ${seriesInfo.subtitle}` : (entry.kicker || '');
            const readable = c && c.pageCount > 0 && c.status !== 'Coming Soon';
            const related = (entry.related || []).map(rs => {
                const rc = beginCaseBySlug(rs);
                return `<button class="begin-related-btn" onclick="showBeginStory('${rs}')">${rc ? rc.title : rs}</button>`;
            }).join('');
            d.innerHTML = `<article class="begin-story">` +
                (img ? `<div class="begin-hero"><img src="${img}" alt="${c.title}"></div>` : '') +
                (meta ? `<div class="begin-story-meta">${meta}</div>` : '') +
                `<h2 class="begin-story-title">${c ? c.title : (entry.title || slug)}</h2>` +
                (c && c.tagline ? `<p class="begin-story-tagline">${c.tagline}</p>` : '') +
                `<div class="begin-story-body">${entry.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>` +
                (readable ? `<a class="begin-read-btn" href="/case-file/${slug}/start">Read the full case &rarr;</a>` : '') +
                (related ? `<div class="begin-related"><span class="begin-related-label">Continue with</span><div class="begin-related-btns">${related}</div></div>` : '') +
                `</article>`;
            d.scrollTop = 0;
        }
        function openBegin() {
            document.getElementById('begin-overlay').classList.add('open');
            if (beginData) showBeginAbout();
        }
        function closeBegin() {
            document.getElementById('begin-overlay').classList.remove('open');
        }
        function beginBackdrop(e) {
            if (e.target === document.getElementById('begin-overlay')) closeBegin();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeBegin();
            if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'begin-pill') openBegin();
        });

        // 1. Fallback Menu Builder (Used only if Server-Side Rendering misses)
        function buildMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            data.series.forEach(series => {
                const seriesCases = data.cases.filter(c => c.seriesId === series.id);
                if (seriesCases.length === 0) return;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'series-group';
                
                const romanNumeral = series.title.split(' ')[1] || ''; 
                groupDiv.innerHTML = `
                    <div class="series-header">
                        <div class="series-num">${romanNumeral}</div>
                        <div class="series-title-wrap">
                            <div class="series-label">${series.title}</div>
                            <div class="series-title">${series.subtitle}</div>
                        </div>
                    </div>
                `;

                const listDiv = document.createElement('div');
                listDiv.className = 'menu-list';

                seriesCases.forEach(c => {
                    const caseNum = c.id.split('.').pop().padStart(2, '0');
                    const link = document.createElement('div');
                    link.className = 'story-link';
                    link.id = `link-case-${c.id}`;
                    link.onclick = () => loadCase(c.id);
                    
                    link.innerHTML = `
                        <div class="story-link-left">
                            <span class="case-num">${caseNum}</span>
                            <span class="story-title">${c.title}</span>
                        </div>
                        <span class="page-count">${c.pageCount > 0 ? c.pageCount : 'Soon'}</span>
                    `;
                    listDiv.appendChild(link);
                });

                groupDiv.appendChild(listDiv);
                container.appendChild(groupDiv);
            });
        }

        // 2. Load Case Logic
        function loadCase(caseId) {
            if (!catalogData) return;
            const currentCase = catalogData.cases.find(c => c.id === caseId);
            if (!currentCase) return;

            localStorage.setItem('lastActiveCase', caseId);
            const seriesInfo = catalogData.series.find(s => s.id === currentCase.seriesId);

            // --- DYNAMIC VIDEO BACKGROUND LOGIC ---
            const bgVideo = document.getElementById('right-bg-video');
            if (window.innerWidth > 800) {
                // Securely extract the series number (e.g., converts 'series-1' or '1' to just '1')
                const seriesMatch = seriesInfo.id.match(/\d+/);
                const seriesNum = seriesMatch ? seriesMatch[0] : seriesInfo.id.replace('series-', '');
                const newVidSrc = `/the-psyche/video/series-${seriesNum}.mp4`;

                // Only reload if the series has actually changed
                if (bgVideo.getAttribute('src') !== newVidSrc) {
                    bgVideo.style.opacity = 0; // Seamless fade out
                    // Defer the heavy video download to idle time so the page becomes
                    // usable immediately and the tab's loading spinner stops right away.
                    var _loadBgVideo = function () { bgVideo.setAttribute('src', newVidSrc); };
                    if ('requestIdleCallback' in window) { requestIdleCallback(_loadBgVideo, { timeout: 2000 }); }
                    else { setTimeout(_loadBgVideo, 800); }
                    
                    bgVideo.oncanplay = () => {
                        const playPromise = bgVideo.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                bgVideo.style.opacity = 1; // Fade in once playing
                            }).catch(e => console.log("Video playback paused by browser policy"));
                        }
                    };
                    
                    bgVideo.onerror = () => {
                        bgVideo.style.opacity = 0; // Fail gracefully if video doesn't exist on server
                    };
                }
            } else {
                bgVideo.style.opacity = 0;
                bgVideo.pause();
            }
            // --------------------------------------

            document.querySelectorAll('.story-link').forEach(link => link.classList.remove('active'));
            const activeLink = document.getElementById(`link-case-${caseId}`);
            if (activeLink) activeLink.classList.add('active');

            const boardWrapper = document.getElementById('board-wrapper');
            boardWrapper.classList.remove('loaded');

            if (currentCase.nodes && currentCase.nodes.length === 3) {
                currentCase.nodes.forEach(node => {
                    const preloadImg = new Image();
                    preloadImg.src = node.image;
                });
            }

            setTimeout(() => {
                document.getElementById('dash-meta-left').innerText = `CASE ${currentCase.id.split('.').pop().padStart(2, '0')} • ${seriesInfo.title.toUpperCase()}`;
                document.getElementById('dash-meta-right').innerText = `STATUS: ${currentCase.status.toUpperCase()}`;
                document.getElementById('dash-title').innerText = currentCase.title;
                document.getElementById('dash-tagline').innerText = `"${currentCase.tagline}"`;

                if (currentCase.nodes && currentCase.nodes.length === 3) {
                    for(let i=1; i<=3; i++) {
                        const nodeImg = document.getElementById(`node-img-${i}`);
                        nodeImg.src = currentCase.nodes[i-1].image;
                        nodeImg.alt = currentCase.nodes[i-1].label;
                        document.getElementById(`node-label-${i}`).innerText = currentCase.nodes[i-1].label;
                    }
                }

                const dock = document.getElementById('mini-dock');
                dock.innerHTML = '';
                for(let i=0; i<currentCase.pageCount; i++) {
                    const dot = document.createElement('div');
                    dot.className = i === 0 ? 'mini-dock-item active' : 'mini-dock-item';
                    dock.appendChild(dot);
                }

                const readBtn = document.getElementById('read-btn');
                if (currentCase.pageCount > 0) {
                    readBtn.href = `/case-file/${currentCase.slug}/start`;
                    readBtn.style.display = 'inline-block';
                } else {
                    readBtn.removeAttribute('href');
                    readBtn.style.display = 'none';
                }

                boardWrapper.classList.add('loaded');
            }, 300);
        }

        // 3. Boot Sequence
        async function init() {
            try {
                // If the server didn't inject the data, fetch it manually (The Safety Net)
                if (!catalogData) {
                    const response = await fetch('/data/catalog.json');
                    catalogData = await response.json();
                    buildMenu(catalogData); // Build the menu since the server didn't
                }

                // Load the Begin overlay data (About + The Thin Ice reading). Non-fatal:
                // if it fails, the Begin pill simply opens an empty shell.
                try {
                    const beginResp = await fetch('/data/begin.json?t=' + Date.now(), { cache: 'no-store' });
                    if (beginResp.ok) beginData = await beginResp.json();
                } catch (e) {
                    console.log('Begin data failed to load.', e);
                }
                if (beginData) buildBegin();

                // Load the last viewed case
                if (catalogData && catalogData.cases.length > 0) {
                    const savedCase = localStorage.getItem('lastActiveCase');
                    const savedValid = savedCase && catalogData.cases.some(c => c.id === savedCase);
                    const caseToLoad = savedValid ? savedCase : catalogData.cases[0].id;
                    loadCase(caseToLoad);
                    
                    const savedScroll = localStorage.getItem('menuScrollPos');
                    if (savedScroll) {
                        const leftPanel = document.querySelector('.left-panel');
                        const y = parseInt(savedScroll, 10);
                        // iOS Safari finishes laying out (and may reset) the menu
                        // AFTER this tick, so apply the restore on the next frame(s)
                        // rather than synchronously — otherwise it snaps back to top.
                        requestAnimationFrame(() => {
                            leftPanel.scrollTop = y;
                            requestAnimationFrame(() => { leftPanel.scrollTop = y; });
                        });
                    }
                }
            } catch (error) {
                console.error("Failed to load catalog:", error);
                document.getElementById('dash-title').innerText = "Error loading connection.";
            }
        }

        // Start the app
        init();

        // Persist the left-menu scroll position. iOS Safari fires 'beforeunload'
        // unreliably (usually never), so the position was being lost on iPad. Save
        // continuously as the user scrolls (debounced) and on the events iOS DOES
        // fire when leaving/backgrounding a page — 'pagehide' and visibility→hidden.
        (function () {
            const leftPanel = document.querySelector('.left-panel');
            if (!leftPanel) return;
            const saveScroll = () => {
                try { localStorage.setItem('menuScrollPos', leftPanel.scrollTop); } catch (e) {}
            };
            let t;
            leftPanel.addEventListener('scroll', () => {
                clearTimeout(t);
                t = setTimeout(saveScroll, 100);
            }, { passive: true });
            window.addEventListener('pagehide', saveScroll);
            window.addEventListener('beforeunload', saveScroll);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') saveScroll();
            });
        })();
    </script>

    <!-- The Three Worlds — shared collection menu (see PROJECT-SCOPE.md) -->
    <script src="https://aminsadeghi.me/menu.js?project=psyche&offset=0" defer></script>
